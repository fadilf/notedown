name: Release APK

on:
  push:
    branches: [main]
    paths: [app/build.gradle.kts]

permissions:
  contents: read

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release detection
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check version increase
        id: version
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python3 -B .github/scripts/release_version.py "$BEFORE" "$AFTER"

  release:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore signing key
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/notedown-release.jks
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          for name in KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret: $name. See docs/RELEASING.md."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_PATH"
          echo "RELEASE_KEYSTORE_PATH=$RELEASE_KEYSTORE_PATH" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and build signed APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Verify APK signature and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          cp "$APK" "Notedown-$VERSION.apk"
          sha256sum "Notedown-$VERSION.apk" > "Notedown-$VERSION.apk.sha256"
          gh release create "v$VERSION" \
            "Notedown-$VERSION.apk" "Notedown-$VERSION.apk.sha256" \
            --target "$GITHUB_SHA" --title "Notedown $VERSION" --generate-notes --latest
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/notedown-release.jks"
